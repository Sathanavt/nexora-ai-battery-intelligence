<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NEXORA - Secure Battery Analytics Platform</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="login-page-wrapper">
    <!-- Main Login Card -->
    <div class="login-card">
      
      <!-- Brand Header -->
      <div class="brand-header">
        <div class="brand-logo-wrapper">
          <img src="assets/logo.svg" alt="NEXORA Logo" class="brand-logo-img" />
        </div>
        <h1 class="brand-title">NEXORA</h1>
        <h2 class="brand-subtitle">AI Battery Intelligence</h2>
        
        <div class="system-status-badge">
          <div class="status-dot"></div>
          Secure Battery Analytics Platform
        </div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form">
        
        <!-- Error Banner -->
        <div id="errorBanner" class="error-banner">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="errorMessage">Invalid username or password.</span>
        </div>

        <div class="form-group">
          <label for="usernameInput" class="form-label">Username / Email</label>
          <div class="input-container">
            <input type="text" id="usernameInput" class="form-input" placeholder="Enter your username or email" autocomplete="username" required />
          </div>
        </div>

        <div class="form-group">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="input-container">
            <input type="password" id="passwordInput" class="form-input" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" id="passwordToggleBtn" class="password-toggle-btn" aria-label="Show password">
              <svg id="passwordIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-utility-row">
          <label class="checkbox-label" for="rememberCheckbox">
            <input type="checkbox" id="rememberCheckbox" class="checkbox-input" />
            Remember me
          </label>
          <a href="#" class="forgot-password-link" tabindex="-1">Forgot Password?</a>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <span id="btnText">Sign In</span>
          <div id="btnSpinner" class="spinner" style="display: none;"></div>
        </button>

      </form>

      <!-- Demo Accounts -->
      <div class="demo-accounts-wrapper">
        <div class="demo-title">Demo Access</div>
        <div class="demo-pills">
          <button type="button" id="demoAdminBtn" class="demo-pill-btn">
            <span class="demo-pill-role">Admin Demo</span>
            <span class="demo-pill-user">nexora.admin</span>
          </button>
          <button type="button" id="demoUserBtn" class="demo-pill-btn">
            <span class="demo-pill-role">User Demo</span>
            <span class="demo-pill-user">nexora.user</span>
          </button>
        </div>
      </div>
      
      <div class="card-footer-tag">
        Enterprise Security • Encrypted Session • Restricted Access
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/login.js"></script>

</body>
</html>
